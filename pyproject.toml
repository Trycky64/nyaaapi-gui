[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyaaapi-gui"
version = "1.0.0"
description = "Desktop search interface for the unofficial Nyaa-API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Trycky64" }]
dependencies = [
    "PySide6>=6.7,<7",
    "nyaaapi-client @ git+https://github.com/Trycky64/nyaaapi-client.git@v0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "build>=1.2"]
release = ["pyinstaller>=6.10", "qbittorrent-api>=2024.10"]

[project.gui-scripts]
nyaaapi-gui = "nyaaapi_gui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nyaaapi_gui = ["resources/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=nyaaapi_gui --cov-report=term-missing"
markers = ["integration: optional tests that contact the live Nyaa-API"]

[tool.coverage.run]
source = ["nyaaapi_gui"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["nyaaapi_gui"]
ignore_missing_imports = true
